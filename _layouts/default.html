<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
</head>
<body>
  <nav class="nav">
    <div class="nav-container">
      <a href="{{ '/' | relative_url }}">
        <h2 class="nav-title">{{ site.title }}</h2>
      </a>
      <ul>
        <li><a href="{{ '/' | relative_url }}">Posts</a></li>
        <li><a href="{{ '/tags' | relative_url }}">Tags</a></li>
        <li><a href="{{ site.author.url }}">About</a></li>
      </ul>
    </div>
  </nav>

  <main>
    {{ content }}
  </main>

  <footer>
    <span>
      &copy; <time datetime="{{ site.time | date: '%Y' }}">{{ site.time | date: '%Y' }}</time> {{ site.author.name }}. Made with Jekyll, styled after the <a href="https://github.com/chesterhow/tale/">Tale</a> theme.
    </span>
  </footer>
</body>
</html>
